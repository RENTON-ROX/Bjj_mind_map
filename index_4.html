<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>BJJ for Wrestlers → White to Black Mind Map</title>
<style>
:root{--bg:#0b0f17;--bg2:#0f1522;--panel:#111927;--panel2:#16202f;--line:#223049;--ink:#e7edf7;--muted:#9fb0c9;--muted2:#6f819e;--accent:#4f8cff;--gold:#e7c268;--white:#c7d0dd;--blue:#3b82f6;--purple:#a855f7;--brown:#d08a3e;--black:#8b95a6;--ok:#3ecf8e;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 700px at 20% -10%,#14203a 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,30,50,.7),rgba(12,17,26,.4));backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;background:conic-gradient(from 220deg,#e7c268,#3b82f6,#a855f7,#d08a3e,#c7d0dd,#e7c268);display:grid;place-items:center;font-weight:800;color:#0b0f17;font-size:18px;box-shadow:var(--shadow);letter-spacing:.5px}
.brand h1{font-size:17px;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 40px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative}
.search input{width:230px;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#33507e;background:#1a2740}
.btn:active{transform:translateY(1px)}
.btn .ico{display:inline-block;line-height:1}
.btn .short{display:none}
.btn,.chip,.mapbtns button,.zoomgroup button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn.primary{background:linear-gradient(180deg,#3f79e8,#2f62c9);border-color:#3f79e8;color:#fff}
.zoomgroup{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zoomgroup button{border:none;background:var(--panel2);color:var(--ink);width:36px;height:37px;cursor:pointer;font-size:16px}
.zoomgroup button:hover{background:#1a2740}
.zoomgroup button+button{border-left:1px solid var(--line)}
.belts{display:none;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(10,15,24,.4);flex-wrap:wrap}
.belts .lbl{font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{--c:#888;display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.chip .count{font-size:11px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
.chip:hover{transform:translateY(-1px)}
.chip.off{opacity:.38;filter:saturate(.4)}
.chip.all{--c:var(--gold)}
.hint{font-size:12px;color:var(--muted2);margin-left:4px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:14px;padding-left:14px;border-left:1px solid var(--line)}
.ldot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #0b0f17;box-shadow:0 0 4px rgba(0,0,0,.4)}
.ldot.green{background:#3ecf8e}
.ldot.purple{background:#a855f7}
.ldot.orange{background:#f7941e}
main{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"lib" "map";min-height:0;position:relative;overflow:hidden}
@media(max-width:960px){main{grid-template-columns:1fr 320px}}
.sheetGrip{display:none}
.closeDetail{display:grid;place-items:center;position:absolute;top:10px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;cursor:pointer}
aside.detail{z-index:30}
@media(max-width:1024px){main{grid-template-columns:1fr}
.sheetGrip{display:block;width:44px;height:4px;border-radius:99px;background:#2c3d5c;margin:10px auto 0;flex:0 0 auto}
aside.detail{position:absolute;top:0;left:0;right:0;bottom:0;border-left:none;border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 -16px 48px rgba(0,0,0,.55);transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.72,.25,1)}
aside.detail.open{transform:translateY(0)}
.detail .head{padding:14px 16px 12px;padding-right:54px}
.detail .foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.closeDetail{display:grid;place-items:center;position:absolute;top:10px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;cursor:pointer}
.mapstat{font-size:11px;padding:4px 9px}
.mapbtns button{width:38px;height:38px}}
@media(max-width:720px){header{padding:10px 12px;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.logo{width:34px;height:34px;font-size:14px;border-radius:10px}
.brand{gap:9px}.brand h1{font-size:14.5px}.brand p{font-size:10.5px}
.controls{gap:8px}
.search{flex:1 1 100%}.search input{width:100%;font-size:16px}
.btn{padding:9px 11px;font-size:12.5px}.btn .long{display:none}
#exportBtn .short{display:inline}.zoomgroup button{width:36px;height:36px}
.belts{padding:9px 12px;gap:7px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.belts::-webkit-scrollbar{display:none}
.belts .lbl,.belts .legend,.belts .hint{display:none}
.chip{padding:8px 14px;flex:0 0 auto}
.videoInput,.editbox{font-size:16px}}.mapwrap{grid-area:map;position:relative;overflow:hidden;min-height:0}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.panning{cursor:grabbing}
.edge{fill:none;stroke:#2b3c58;stroke-width:2}
.edge.hl{stroke:var(--accent);stroke-width:2.5}
.node{cursor:pointer}
.node .card{fill:var(--card,#101a2a);stroke:#27384f;stroke-width:1.25;transition:stroke .15s,filter .15s}
.node:hover .card{stroke:#3f5a85}
.node.selected .card{stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 0 10px rgba(79,140,255,.45))}
.node.dim{opacity:.28}
.node .accent{stroke:var(--belt);stroke-width:4;stroke-linecap:round}
.node .title{fill:var(--ink);font-weight:700;font-size:14px}
.node .desc{fill:var(--muted);font-size:11.5px}
.node .tag{fill:var(--belt);font-size:10px;font-weight:700;letter-spacing:.04em}
.node .more{fill:var(--muted2);font-size:10px;font-weight:700}
.node.root .card{fill:#131d30}
.cardInner{font-family:inherit}
.cardInner .t{font-weight:700;font-size:14px;color:var(--ink);line-height:1.2;margin:0 0 3px}
.cardInner .d{font-size:11.5px;color:var(--muted);line-height:1.35;margin:0}
.cardInner .row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cardInner .pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--belt);background:color-mix(in srgb,var(--belt) 16%,transparent);padding:2px 8px;border-radius:999px}
.cardInner .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--belt)}
.cardInner .more{margin-left:8px;font-size:10px;font-weight:700;color:var(--muted2)}
.cardInner .nav{display:inline-flex;align-items:center;gap:2px;margin-left:8px}
.cardInner .navbtn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted2);width:20px;height:19px;line-height:1;font-size:12px;font-weight:700;border-radius:6px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cardInner .navbtn:hover{color:var(--ink);border-color:var(--belt);background:color-mix(in srgb,var(--belt) 22%, transparent)}
.cardInner .navbtn:disabled{opacity:.32;cursor:default;pointer-events:none}
.node .vdot{filter:drop-shadow(0 0 4px rgba(0,0,0,.5))}
/* Iridescent identity for CUSTOM (user-created) bubbles */
@keyframes iriShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes iriHue{0%{stroke:#ff5fa2}25%{stroke:#ffc24b}50%{stroke:#48e0a2}75%{stroke:#4bb8ff}100%{stroke:#ff5fa2}}
.node.custom .cardInner .pill{color:#0b0f17;border:1px solid rgba(255,255,255,.45);background-image:linear-gradient(100deg,#ff5fa2,#ffc24b,#48e0a2,#4bb8ff,#a475ff,#ff5fa2);background-size:300% 100%;animation:iriShift 6s linear infinite}
.node.custom .cardInner .pill .dot{background:radial-gradient(circle at 32% 30%,#fff,#e9f6ff 45%,#bfe0ff 100%);box-shadow:0 0 0 1px rgba(11,15,23,.35),0 0 6px rgba(255,255,255,.85)}
.node.custom .accent{animation:iriHue 6s linear infinite}
.node.custom .card{animation:iriHue 8s linear infinite}
.mapbtns{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.mapbtns button:hover{background:#1a2740;border-color:#33507e}
.mapstat{position:absolute;left:14px;bottom:14px;font-size:11.5px;color:var(--muted2);background:rgba(10,15,24,.6);padding:5px 10px;border-radius:8px;border:1px solid var(--line);z-index:3}
.map-hint{position:absolute;left:14px;top:14px;max-width:330px;font-size:11.5px;line-height:1.5;color:#c4d1e6;background:rgba(10,15,24,.74);padding:8px 11px;border-radius:9px;border:1px solid var(--line);z-index:3}
.map-hint b{color:#eaf1fb}
.detail{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.detail .head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}@media(min-width:1025px){aside.detail{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:88vw;z-index:40;transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.72,.25,1);box-shadow:-12px 0 34px rgba(0,0,0,.4)}aside.detail.open{transform:translateX(0)}.detail .head{padding-right:54px}}
.beltline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.beltbadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;color:#0b0f17;background:var(--belt);letter-spacing:.02em}
.beltbadge.light{color:#0b0f17}
.crumb{font-size:12px;color:var(--muted2)}
.beltmatch{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.beltmatch:hover{border-color:var(--accent);color:var(--ink);background:#1a2740}
.detail h2{font-size:20px;margin:2px 0 0;line-height:1.2}
.detail .body{padding:16px 18px;overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}
.sec{margin-bottom:20px}
.sec .lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
.sec .lbl .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.descbox{font-size:14px;line-height:1.55;color:#cdd8ea;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:13.5px;line-height:1.5;color:#c4d1e6}
ol.steps li:not(:last-child)::before{content:"";position:absolute;left:12px;top:22px;bottom:0;width:2px;background:var(--line)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;background:linear-gradient(180deg,#22314d,#182541);color:var(--accent);border:1px solid #2c4066}
.whybox{font-size:13.5px;line-height:1.6;color:#c4d1e6}
.whybox b{color:var(--gold);font-weight:700}
.cues{display:flex;flex-wrap:wrap;gap:7px}
.cue{font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cue::before{content:"? ";color:var(--ok);font-weight:800}
.children{display:flex;flex-direction:column;gap:8px}
.childrow{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);transition:.15s}
.childrow:hover{border-color:#3f5a85;transform:translateX(2px)}
.childrow .num{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:#1c2a44;color:var(--accent);margin-top:1px}
.childrow .ct{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.childrow .cd{font-size:12px;color:var(--muted);line-height:1.4}
.childrow .go{margin-left:auto;color:var(--muted2);font-size:16px;align-self:center}
.empty{padding:30px 18px;text-align:center;color:var(--muted2)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6;max-width:280px;margin:6px auto 0}
.backbtn{width:100%;justify-content:center;margin-bottom:14px}
.kbd{font-family:ui-monospace,Consolas,monospace;background:#0d1626;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
.foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted2);line-height:1.5}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:#223049;border-radius:8px;border:2px solid var(--panel)}
.scroll::-webkit-scrollbar-track{background:transparent}.videoRow{display:flex;gap:8px;flex-wrap:wrap}
.videoInput{flex:1 1 220px;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;outline:none}
.videoInput:focus{border-color:var(--accent)}
.videoOpen{display:inline-flex;align-items:center;gap:7px;margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.videoOpen:hover{text-decoration:underline}
.videoEmbed{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
.videoEmbed iframe{display:block;width:100%;aspect-ratio:16/9;border:none}
.videoEmbed video{display:block;width:100%;max-height:320px;background:#000}
.videoNote{font-size:11.5px;color:var(--muted2);margin-top:8px;line-height:1.5}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.danger{border-color:#7a3540;background:rgba(220,80,80,.08);color:#f2a0a0}
.btn.danger:hover{background:rgba(220,80,80,.16);border-color:#a04a5a}
.addbox{background:rgba(79,140,255,.07);border:1.5px dashed #33507e;border-radius:12px;padding:12px 14px}
.aibox{background:rgba(231,194,104,.06);border:1px solid #3a3320;border-radius:12px;padding:12px 14px}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.addrow .videoInput{flex:1 1 180px;min-width:150px}
.statusline{font-size:12.5px;line-height:1.45;margin:8px 0 2px;padding:8px 10px;border-radius:8px}
.statusline.ok{color:var(--ok);background:rgba(62,207,142,.08)}
.statusline.err{color:#f2a0a0;background:rgba(220,80,80,.08)}
.statusline.busy{color:var(--muted);background:var(--panel2)}
.hintinline{font-size:11px;color:var(--muted2);margin-left:4px}
.editbox{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;outline:none;font-family:inherit;line-height:1.5;resize:vertical;min-height:60px}
.editbox:focus{border-color:var(--accent)}
.howwrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.howwrap:focus-within{border-color:var(--accent)}
.howwrap .editbox{flex:1 1 auto;width:auto;border:0;border-radius:0;background:transparent;resize:none;padding:10px 12px}
.hownums{flex:0 0 32px;width:32px;overflow:hidden;padding:10px 8px 10px 0;text-align:right;border-right:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted2);user-select:none;pointer-events:none;font-size:13px;line-height:1.5;font-family:inherit}
.hownums-in{white-space:pre;font-size:13px;line-height:1.5;font-family:inherit;will-change:transform}
.titleinput{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;font-weight:700;outline:none}
.titleinput:focus{border-color:var(--accent)}
.savedflash{position:fixed;top:12px;right:16px;z-index:99;font-size:13px;font-weight:700;color:var(--ok);background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.3);padding:6px 14px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.savedflash.show{opacity:1}
.steprmv{margin-left:8px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px;cursor:pointer}
.steprmv:hover{border-color:#a04a5a;color:#f2a0a0}
ol.steps li.yours{color:var(--gold)}
.aiset{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.aiset summary{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:8px}
.dragGhost{position:fixed;pointer-events:none;z-index:999;display:none;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.6);transform:translate(-50%,-110%)}
.dragGhost .t{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:3px}
.dragGhost .s{font-size:11px;color:var(--muted)}
body.dragging .node[data-tree="skills"]{outline:2px dashed var(--ok);outline-offset:3px}
.node.dropok{filter:drop-shadow(0 0 8px rgba(62,207,142,.5))}
.node.dropover .card{stroke:var(--ok);stroke-width:3}
.edge.dragline{stroke:var(--ok);stroke-width:2.5;stroke-dasharray:8 4}
/* ---- reorder an existing bubble by dragging it ---- */
.canDrag{cursor:grab;touch-action:none}
.canDrag:active{cursor:grabbing}
.node.dragSrc .card{stroke:var(--accent);stroke-width:2;opacity:.5}
.node.dragSrc .cardInner{opacity:.6}
.node.reorderover .card{stroke:var(--accent);stroke-width:3}
.reorderLine{stroke:var(--ok);stroke-width:3;stroke-linecap:round;pointer-events:none;filter:drop-shadow(0 0 6px rgba(62,207,142,.6))}

/* ======================= TECHNIQUE LIBRARY (left panel) ======================= */
.library{grid-area:lib;display:flex;flex-direction:column;border-bottom:1px solid var(--line);background:var(--panel);min-height:0}
.lib-header{padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lib-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:10px}
.lib-title .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.lib-toggle{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 8px;border-radius:6px}
.lib-toggle:hover{background:var(--panel2);color:var(--ink)}
.lib-filter{width:100%;box-sizing:border-box;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;outline:none}
.lib-filter:focus{border-color:var(--accent)}
.lib-actions{display:flex;gap:6px;margin-top:8px}
.lib-act{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:11.5px;cursor:pointer;white-space:nowrap}
.lib-act:hover{border-color:#33507e;background:#1a2740}
.lib-tree{flex:1;overflow:auto;min-height:0;padding:8px 10px}
.tree-section{margin-bottom:4px}
.tree-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;user-select:none;transition:.12s}
.tree-row:hover{background:#1a2740}
.tree-row .tw{width:12px;color:var(--muted);font-size:11px;flex:0 0 auto;transition:transform .15s}
.tree-row.collapsed .tw{transform:rotate(-90deg)}
.tree-row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tree-row .label{flex:1;font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .cnt{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px;flex:0 0 auto}
.tree-children{padding:6px 6px 4px 8px}
.tree-children.hidden{display:none}
.topic-label{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted2);margin:8px 4px 4px}
.tree-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:grab;font-size:12.5px;color:#c4d1e6;transition:.12s;user-select:none}
.tree-item:hover{background:#1a2740;color:var(--ink)}
.tree-item:active{cursor:grabbing}
.tree-item .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tree-item .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-empty{font-size:12px;color:var(--muted);padding:10px 6px;font-style:italic}
.lib-hint{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted2);line-height:1.45;flex:0 0 auto}
main.libcollapsed{grid-template-rows:1fr;grid-template-areas:"map"}
main.libcollapsed .library{display:none}
.lib-open-tab{position:absolute;left:14px;top:12px;width:auto;height:auto;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:13px;display:none;align-items:center;gap:6px;z-index:9999;box-shadow:var(--shadow)}
.lib-open-tab:hover{background:var(--accent);color:#fff}
main.libcollapsed .lib-open-tab{display:flex}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo">BJJ</div></div>

<div class="controls">
<button class="btn" id="addRootBtn" title="Add a new root bubble"><span class="ico">⊕</span><span class="long">Add root</span></button><button class="btn" id="expandAll" title="Expand all"><span class="ico">⤢</span><span class="long">Expand all</span></button>
<button class="btn" id="collapseAll" title="Collapse all"><span class="ico">⤡</span><span class="long">Collapse all</span></button>
<div class="zoomgroup"><button id="zoomOut" title="Zoom out">-</button><button id="zoomIn" title="Zoom in">+</button></div>
<button class="btn primary" id="fitBtn" title="Fit to view"><span class="ico">⛶</span><span class="long">Fit to view</span></button>
<button class="btn" id="exportBtn" style="display:none" title="Download a self-contained copy"><span class="ico">↓</span><span class="long">Export self-contained</span><span class="short">Export</span></button>
</div>
</header>
<div class="belts" id="belts">

</div>
<main class="libcollapsed">

<input class="lib-filter" id="libFilter" type="text" placeholder="Filter techniques…" autocomplete="off" spellcheck="false">

</div>

<script>
const T = (title, desc, how, why, cues) => ({ title, desc, how, why, cues });
const TOPIC = (title, desc, children) => ({ title, desc, children });

const ROOT = {
  title: "BJJ for Wrestlers",
  desc: "A position-first, takedown-driven path from white to black belt. Build a wrestling base, turn takedowns into ground dominance, and layer submissions on top.",
  children: [

  /* ============================ WHITE BELT ============================ */
  {
    belt:"White", title:"White Belt",
    desc:"Establish the grappling fundamentals every wrestler must re-learn: position, movement, and the first guard-and-submission toolkit.",
    children:[
      TOPIC("Position & Pressure Fundamentals",
        "Before submissions, learn the hierarchy of positions and the body mechanics that make a wrestler dangerous on the ground.",
        [
          T("Position Hierarchy",
            "Understand the ranked map of ground positions — from side control down to your own guard — so you always know what to chase.",
            [
              "Learn the ranking: back control > mount > side control > knee-on-belly > half guard > open guard > closed guard > your own guard.",
              "Memorize the escape direction for each position (where the space opens) before you learn any technique.",
              "In every drill, name your position out loud and state the one position above it you are trying to reach.",
            ],
            "Wrestlers instinctively hunt for takedowns and top position. Position hierarchy gives you a shared language and a decision tree so you are never scrambling for 'what now?' under pressure.",
            ["Position before submission","Know the space that opens","One goal at a time"]
          ),
          T("Body Mechanics & Base",
            "Transfer your wrestling base to the ground — low center of gravity, engaged core, and the ability to post and recover.",
            [
              "Keep your hips low and heavy; drive from the legs, not the arms, in every bridge and sprawl.",
              "Practice the 'low posture': knees bent, chest over hips, ready to explode to any direction.",
              "Drill sprawls and bridges on the mat until they are automatic, since they feed both defending and attacking.",
            ],
            "Base is the foundation of all ground pressure and escapes. A wrestler's athletic base makes your top control smothering and your sweeps powerful — but it only works if the mechanics are dialed in.",
            ["Hips low, chest over hips","Power from the legs","Athletic posture"]
          ),
          T("Grip & Hand Fighting",
            "The grip fight decides where the match goes. Learn to secure, break, and use grips as a wrestler.",
            [
              "Attack their grips first: break a wrist grip by lifting the hand and pulling your arm in, then re-grip.",
              "Secure deep grips (collar, sleeve, wrist) before you act on them — control, then move.",
              "Keep both hands active: one grips, one frames; never let both hands go idle.",
            ],
            "Grips are the levers that create all position and submission openings. Wrestlers already fight for control — the gi just gives more to grab, so hand-fighting becomes a constant weapon.",
            ["Control then move","Keep both hands busy","Break before you act"]
          ),
        ]),
      TOPIC("Guard Retention & Mobility",
        "When you get taken down (and you will), the guard is your safety net. Learn to stay connected, create space, and reset.",
        [
          T("Shrimping (Hip Escape)",
            "The single most important ground movement: creating space and resetting your hips while staying connected.",
            [
              "Bend the knees and dig the shoulder and elbow into the mat.",
              "Push with that arm and hip to swing the hips back into a crescent path, then back forward.",
              "Keep the body in one connected unit — shoulders, hips, legs moving as a chain.",
              "Use it to create space, recover guard, or set up a sweep without losing contact.",
            ],
            "Shrimping is the base language of BJJ. It turns a lost position into a live one and is the mechanic inside every sweep and escape. Wrestlers who master it stop feeling helpless when taken down.",
            ["Shoulder and elbow dig in","Crescent hip path","Stay connected"]
          ),
          T("Closed Guard",
            "The classic defensive position: legs locked, hands framed, and you in control of the distance.",
            [
              "Clamp the legs around the trunk and hug the elbows to the ribs to control their frame.",
              "Frame with the forearms on the chest and hips to stop forward pressure.",
              "Keep the hips high and the legs tight — the tighter the clamp, the safer the position.",
              "From here you can post, off-balance them, and set up a sweep or attack.",
            ],
            "Closed guard is the first 'I am not in trouble' position. It lets a wrestler who gets taken down immediately neutralize the top pressure and start dictating the game again.",
            ["Elbows hugged in","Hips high, legs tight","Frame the chest"]
          ),
          T("Open Guard",
            "When one leg opens, use it to control, off-balance, and set up sweeps or attacks.",
            [
              "Keep one foot hooked behind their hip while the other frames or hooks their far arm.",
              "Use the open leg to push their hip off-center and pull them forward to collapse the spine.",
              "Keep the connected leg active — it is your rudder for direction and distance.",
              "Flow into a kimura, triangle, or sweep as their balance breaks.",
            ],
            "Open guard is where wrestlers first find attack. It turns defense into a position where you control their balance and can finish with chokes or arm locks — a huge contrast to a wrestler's usual 'get up or get submitted' dilemma.",
            ["One leg connected","Collapse their spine","Flow to attack"]
          ),
          T("Technical 6 / 50-50 Guard",
            "The natural guard for a wrestler: legs on the hips, ready to sprawl or sweep from a takedown-like base.",
            [
              "Land on your side with both legs hooked over their hips, like a sprawl position.",
              "Frame their chest and neck, keeping your hips flat and your back on the mat.",
              "Attack with a body lock (arms under the arms, legs on the hips) to sweep or take the back.",
              "Use your wrestling base to defend takedowns and immediately counter-sweep.",
            ],
            "Technical 6 is essentially a wrestler's base turned into guard. It lets you use the sprawl, body lock, and posture you already have to sweep or steal the back from the bottom.",
            ["Sprawl-like base","Frame the chest","Body-lock to sweep"]
          ),
        ]),
      TOPIC("Sweeps",
        "The first, highest-percentage sweeps every wrestler must have. Use your base and body control to reverse the top player and end up on top.",
        [
          T("Hip Bump Sweep",
            "The most fundamental sweep: use your hips to lift and roll a posted top player from closed guard.",
            [
              "Keep the closed guard tight with both legs clamped and the elbows hugged in.",
              "Pull their head or arm to off-balance them and create the angle.",
              "Plant one foot, then drive the hips up and over toward the trapped side.",
              "Use the hip bump to roll them onto their back while you recover to guard.",
            ],
            "The hip bump is the first sweep and a direct transfer of a wrestler's hip power. It teaches the core sweep mechanic — off-balance, then drive the hips — that underlies every more advanced sweep.",
            ["Tight closed guard","Off-balance first","Drive the hips up"]
          ),
          T("Scissor Sweep",
            "A classic open-guard sweep using the legs as scissors to roll a top player off balance.",
            [
              "Set up the open guard with one leg hooked and the other free.",
              "Control their head and the near arm to set the off-balance.",
              "Scissor the free leg across their body as you turn.",
              "Lift with the hips and roll them to your guard.",
            ],
            "The scissor sweep is the bridge from open guard to reversal. For a wrestler, the scissoring leg action mirrors the leg control they already use, making it an intuitive first offensive sweep.",
            ["One leg hooked","Control the head","Scissor and lift"]
          ),
          T("Kimura Sweep",
            "Use the kimura to off-balance and roll the opponent while keeping a locked grip — a pure wrestler's control sweep.",
            [
              "Establish the kimura (figure-four) on one of their arms.",
              "Rotate their shoulder up and back to pull them off center.",
              "Keep the figure-four locked and post one leg to roll.",
              "Use the arm control to drive the reversal back to your guard.",
            ],
            "The kimura sweep is the control-based sweep a wrestler loves: the grip does the off-balancing while the body does the rolling. It doubles as a submission threat, so the opponent can't just post and reset.",
            ["Lock the figure-four","Rotate to off-balance","Roll with the grip"]
          ),
          T("Body-Lock / Butterfly Sweep",
            "Use a body lock and leg drive to sweep from the bottom — the double-leg mechanic turned into a guard sweep.",
            [
              "From your guard, post and take the body lock (arm under, leg over the hip).",
              "Break their base by pulling the head and driving the legs.",
              "Use the leg drive to lift and spin them, like a double-leg takedown.",
              "Finish the sweep and land back in your guard or on top.",
            ],
            "This is the wrestler's signature bottom sweep. The body lock and leg drive are the same mechanics as a double-leg, so a wrestler can sweep from the bottom with the same power they use to take someone down.",
            ["Take the body lock","Break the base","Leg drive to spin"]
          ),
          T("Head-Control Flat Guard Sweep",
            "Control the head and use the legs to sweep a postured top player from flat guard.",
            [
              "From flat guard, control their head with one hand and their arm with the other.",
              "Hook the legs to off-balance and set the sweep.",
              "Pull the head and lift with the hips to roll them.",
              "Recover to your guard as they turn.",
            ],
            "Head control is the simplest way to off-balance a postured top player, and it flows naturally from the hand-fighting a wrestler already does. It is a reliable, low-risk sweep for early training.",
            ["Control the head","Hook the legs","Pull and lift"]
          ),
        ]),
      TOPIC("First Submissions",
        "A small, high-percentage arsenal that works from any guard or top position. Learn these deeply before adding more.",
        [
          T("Triangle Choke",
            "The go-to guard attack: a leg entanglement that chokes with a scissoring motion.",
            [
              "Hook one leg over their shoulder and bring the other foot behind their neck.",
              "Pull their head down and turn your body toward the trapped arm to tighten the scissors.",
              "Lock the ankle, widen the triangle, and squeeze with the inner thighs and hip flexors.",
              "Keep their head down — the angle, not the squeeze alone, is what finishes.",
            ],
            "The triangle is the most learnable submission from the bottom and the perfect first submission for a wrestler. It uses the leg entanglement and body control you already understand, and finishes from guard without you ever losing position.",
            ["Ankle locked, head down","Squeeze with the hips","Turn toward the trapped arm"]
          ),
          T("Armbar (from Guard)",
            "Isolate one arm on the straight-arm extension and hyperextend the elbow.",
            [
              "Isolate the arm — control the wrist and bring it to your hip/shoulder line.",
              "Keep your hips close and the arm on a straight line to your body.",
              "Bridge with the hips over the arm and pull down on the elbow to hyperextend.",
              "Rotate your body toward them to increase the angle and finish.",
            ],
            "The armbar is the first arm lock and the bridge between guard and submission. For a wrestler who controls the grip fight, isolating one arm is natural, and the hip bridge uses the same hip power as a sweep.",
            ["Arm on a straight line","Hips close","Bridge and pull"]
          ),
          T("Kimura / Americana",
            "A figure-four arm lock from the side — a natural follow to the hand-fighting you already do.",
            [
              "Create the figure-four: your hand grips their wrist, their hand is trapped under your armpit.",
              "Rotate their shoulder up and back across your body while you sit up.",
              "Bring their trapped arm across your chest and finish by pulling and turning them.",
              "Use it as a transitional attack after breaking their posture.",
            ],
            "The kimura flows directly from the wrist and hand control a wrestler already loves. It doubles as an off-balancing tool — even when it does not tap, it breaks their posture and sets up sweeps and other attacks.",
            ["Figure-four locked","Rotate the shoulder up","Pull across the chest"]
          ),
          T("Guillotine Choke",
            "A strangle from the top or bottom using the arm and forearm around the neck.",
            [
              "Hook the arm around the neck and lock the hands (figure-four or a high collar grip).",
              "Keep the forearm across the throat and pull their head down into your armpit.",
              "Squeeze with the bicep and the opposite arm, keeping the angle tight.",
              "From the bottom, post and off-balance to create the choke angle.",
            ],
            "The guillotine is the most common transition choke and a natural finish after a body lock or takedown for a wrestler. It rewards the body control and hand-fighting that wrestling already develops.",
            ["Forearm across the throat","Head into the armpit","Tighten the angle"]
          ),
          T("Rear Naked Choke (intro)",
            "The signature submission from the back — the ultimate position for a wrestler who can take it.",
            [
              "From the back, secure a deep base with the hooks (or body lock) and control the head.",
              "Thread the arm under the chin, lock the hands, and keep the elbow tight to the ribs.",
              "Squeeze with the bicep and the tricep, keeping the angle on the carotid, not the windpipe.",
              "Stay compact and connected — position first, then the choke.",
            ],
            "The rear naked is the payoff for every wrestler who can take the back. It is the highest-percentage finish and the reason back control sits at the top of the position hierarchy.",
            ["Deep hooks first","Squeeze with the arms","Carotid angle"]
          ),
        ]),
      TOPIC("Wrestler Transitions (Takedown → Ground)",
        "This is your superpower: use the takedowns you already throw to set up guard, sweeps, and submissions.",
        [
          T("Double Leg → Mount",
            "Turn a double-leg takedown directly into mount for immediate top control.",
            [
              "Shoot the double leg and bring them down to the mat.",
              "As they hit the ground, post one hand, drive one knee over their chest, and land in mount.",
              "Keep the head control and the knees pinning the hips to stop the sprawl.",
              "From mount, post up, re-secure, and go to a submission or pass.",
            ],
            "This is the cleanest way a wrestler converts a takedown into BJJ top control. It keeps you in the dominant position without a scramble, so the tap — not the scramble — is the goal.",
            ["Knee over the chest","Control the head","Land in mount"]
          ),
          T("Single Leg → Guard Attack",
            "Use the single-leg to land in a position where you can immediately attack with a choke or arm lock.",
            [
              "Take the single leg and, as they fall, turn their head to one side.",
              "Catch the far arm with a kimura or the near arm with a guillotine as they land.",
              "Use the single-leg body control to prevent them from recovering to guard.",
              "Follow through with the choke or arm lock from the landed position.",
            ],
            "Wrestlers already control the body and the head during a single-leg. Adding a choke or arm lock to that control turns a plain takedown into a high-percentage finish.",
            ["Turn the head","Catch the far arm","Body control prevents recovery"]
          ),
          T("Sprawl → Back Take",
            "Defend a takedown with the sprawl and use the follow-through to steal the back.",
            [
              "As they shoot, sprawl and drive the hips back to stop the takedown.",
              "Pivot the hips and wrap the legs around their far side (body lock) as they commit.",
              "Use the momentum to rotate them onto their chest and thread the arm for the back.",
              "From the back, secure the base and go to the rear naked choke.",
            ],
            "The sprawl is a wrestler's most natural defense. Extending it into a body lock and back take means you are never just 'defending' — you are attacking on the very move they expected to score with.",
            ["Sprawl to stop","Pivot into body lock","Rotate to the back"]
          ),
          T("Takedown Defense & Counter",
            "Read the shot, stop it, and use their commitment against them.",
            [
              "Recognize the level change early and post the base hand before they commit.",
              "Frame the neck or the hips to create space and control the direction.",
              "Counter with a body lock, sweep, or takedown of your own as they are extended.",
              "Stay active — defense should flow straight into offense, not just a reset.",
            ],
            "Wrestlers are already good at reading shots. In BJJ the same reads are rewarded even more, because the counter (body lock, sweep, back take) is more varied and higher-value than in pure wrestling.",
            ["Read the level change","Frame for space","Flow into a counter"]
          ),
        ]),
      TOPIC("Drilling & Rolling Habits",
        "How to practice so the positions and transitions above actually become automatic under pressure.",
        [
          T("Positional Sparring",
            "Sparring from a set position with a clear goal, to build specific skills under resistance.",
            [
              "Set a position (e.g., your guard, their mount) and a single goal (e.g., 'escape to guard' or 'pass').",
              "Roll at 50–60% with the goal in mind, stopping to reset and repeat.",
              "Focus on process and mechanics, not just on making the tap.",
              "Progress the goal once you can do it reliably.",
            ],
            "Positional sparring is the fastest way to turn a known technique into a reliable one. For a wrestler, it bridges the gap between knowing the takedown and knowing what to do the instant you land on the ground.",
            ["Set position + goal","Roll at 50–60%","Process over the tap"]
          ),
          T("Chain Drilling",
            "Link moves into sequences so one action naturally leads to the next.",
            [
              "Pick a starting position and a 3–4 move chain (e.g., close guard → open → kimura → triangle).",
              "Drill the chain slowly and cleanly, emphasizing the transition between each link.",
              "Add speed and then resistance as the chain becomes smooth.",
              "End by rolling the chain at speed with a partner.",
            ],
            "Chains build the 'next move is automatic' quality that separates strong grapplers from hesitant ones. Wrestlers, who already chain takedoffs, will find chain drilling very natural.",
            ["3–4 linked moves","Slow, then fast","Transition is the key"]
          ),
          T("Rolling Etiquette & Communication",
            "How to be a good training partner and learn faster from every roll.",
            [
              "Agree on the goal and pace before you roll; match your partner's level.",
              "Be honest about taping, injuries, and when to stop.",
              "Give and ask for feedback — describe what you felt and what you want to improve.",
              "Protect the tap: the goal is to learn, not to prove.",
            ],
            "Good rolling habits build trust, which means partners go harder and give better feedback. For a wrestler entering the gi community, showing respect for the sport earns you higher-quality training.",
            ["Agree on goal and pace","Communicate feedback","Protect the tap"]
          ),
        ]),
    ]
  },

  /* ============================ BLUE BELT ============================ */
  {
    belt:"Blue", title:"Blue Belt",
    desc:"Expand the game: advanced guard systems, dedicated passing, back control, and the submissions that come from each. Build full transitions, not isolated tricks.",
    children:[
      TOPIC("Advanced Guard Systems",
        "Move from basic closed/open guard to the modern, active guard systems that let a wrestler attack from the bottom with intent.",
        [
          T("De La Riva Guard (DLR)",
            "An outside hook guard that controls the hip and arm to off-balance and attack.",
            [
              "Hook the leg over their hip from the outside, controlling the far hip and the near arm.",
              "Use the DLR leg to pull their hip up and off their base.",
              "Attack with a kimura, armbar, or sweep as their balance breaks.",
              "Switch the hook side to keep the pressure moving and unpredictable.",
            ],
            "DLR is a control-and-off-balance system that matches a wrestler's love of body control. It lets you attack with the arm and sweep without ever giving up the connected, safe guard.",
            ["Outside hook on the hip","Pull them off balance","Attack with the arm"]
          ),
          T("Spider Guard",
            "Feet on the shoulders/arms to create space and set up trips, sweeps, and attacks.",
            [
              "Place the feet on their shoulders or forearms and pull to open space.",
              "Use the feet to control the arms and keep the frame open.",
              "Sweep with a hip lift or trip as their weight shifts forward.",
              "Flow into an armbar or kimura from the opened position.",
            ],
            "Spider guard uses foot-and-hand control to create the exact space a wrestler likes to make with frames. It is safe, active, and opens direct arm attacks.",
            ["Feet on shoulders/arms","Pull for space","Trip or sweep"]
          ),
          T("Butterfly Guard",
            "The feet hooked behind the thighs to create a powerful platform for sweeps and attacks.",
            [
              "Hook both feet behind the inner thighs, like a butterfly sit-up position.",
              "Use the legs as a platform to lift and spin them for a butterfly sweep.",
              "Control the body with the feet to off-balance and set up attacks.",
              "Flow into a body-lock sweep or a leg entanglement attack.",
            ],
            "Butterfly guard is essentially the wrestler's double-leg and body-lock mechanics turned into a bottom attack. The same leg drive that lifts a takedown here sweeps the opponent.",
            ["Feet behind the thighs","Platform to lift","Body-lock sweep"]
          ),
          T("Deep Half Guard (intro)",
            "A safe, connected bottom position from a half guard that controls the base and sets up sweeps.",
            [
              "From a half guard, tuck the head under the arm and hook the far leg behind the knee.",
              "Keep the connected leg and a solid base — the head tucked creates the safety.",
              "Use the body to off-balance and sweep, or set up a triangle.",
              "Maintain the connection; never let go of the leg hook.",
            ],
            "Deep half is the 'I am completely safe' guard for a bottom player. For a wrestler who values not being passed, it is the gold standard of defensive control.",
            ["Head under the arm","Far leg hooked","Safe and connected"]
          ),
        ]),
      TOPIC("Sweeps (Intermediate)",
        "Control-based sweeps that flow out of the advanced guard systems. Off-balance first, then roll with the body and legs.",
        [

              "Pull their hip up and off their base with the DLR leg.",
              "Use the arm control to rotate and off-balance them.",
              "Sweep by turning them as their balance breaks, into a kimura or armbar.",
            ],
            "The DLR sweep uses the outside hook to create the off-balance, matching a wrestler's love of hip and body control. It is a control-based sweep that flows straight into a submission if they defend.",

              "Trip them as their weight shifts forward.",
              "Sweep with a hip lift to recover to your guard.",
            ],
            "The spider sweep uses foot-and-hand control to make the space a wrestler likes to make with frames. It is safe, active, and opens a direct arm attack after the sweep.",

          T("Body Triangle Sweep",

              "Use the triangle to control the base and off-balance them.",
              "Lift and spin with the legs to sweep.",
              "Finish to your guard or a body lock.",
            ],
            "The body triangle sweep is the core of the modern guard-sweep game and a natural extension of a wrestler's body lock. The legs do the work, giving a wrestler a powerful, connected sweep.",
            ["Legs locked around the torso","Control the base","Lift and spin"]
          ),
          T("50/50 / Technical Six Sweep",
            "Sweep from the 50/50 using the legs on the hips and the wrestler's base.",
            [
              "From the 50/50, keep the legs on the hips and frame the chest.",
              "Off-balance with the body and the legs.",
              "Sweep with a leg drive or a hip lift.",
              "Recover to your guard as they turn.",
            ],
            "The 50/50 sweep is a wrestler's natural position — the sprawl and body lock turned into a bottom attack. It lets you sweep with the base and leg drive you already have.",
            ["Legs on the hips","Frame the chest","Leg drive to sweep"]
          ),
          T("Inversion / X-Guard Sweep (intro)",
            "Introduce the inversion: flip over the opponent to off-balance and sweep.",
            [
              "From the guard, set up the inversion with one leg over their shoulder.",
              "Invert over them, keeping the body connected.",
              "Use the inverted body to off-balance and off-center them.",
              "Sweep by rolling them as they react.",
            ],
            "The inversion is the gateway to the advanced bottom game. For a wrestler, the inverted body control is a new but natural extension of the body lock, opening high-value sweeps and attacks.",
            ["Invert over them","Stay connected","Off-balance to sweep"]
          ),
        ]),
      TOPIC("Guard Passing",
        "The top player's game. As a wrestler you already pass by taking them down — now learn to pass on the mat with pressure and position.",
        [
          T("Knee Cut Pass",
            "Split their legs and cut across the body to take the side.",
            [
              "Post and drive one knee between their arm and body to split the legs.",
              "Keep the far leg wide to stop the re-clamp.",
              "Drive across to side control, controlling the near arm.",
              "Post and re-establish top posture to maintain pressure.",
            ],
            "Knee cutting is the most common pass and a natural extension of a wrestler's ability to split the legs and drive forward. It converts top base into dominant side control.",
            ["Knee between arm and body","Keep the far leg wide","Drive to side control"]
          ),
          T("Technical Pass (Stack Pass)",
            "Take their posture, stack their hips, and step over to the side.",
            [
              "Break their posture by taking the head and pulling them forward.",
              "Stack their hips onto their shoulders by driving the weight in.",
              "Step the far leg over their body and drop to side control.",
              "Post and re-secure to keep the pressure on.",
            ],
            "The stack pass uses the same forward pressure and hip drive as a wrestling takedown. For a wrestler, the 'stack' feels like driving someone down, and the finish is a clean side-control pass.",

          ),
          T("Rush / Body-Lock Pass",
            "Wrap the body with a body lock and roll them to the side for a pass.",
            [
              "Secure the body lock (arm under the arm, leg over the hip).",
              "Keep their base broken and drive the roll to the side.",
              "Finish in side control or a mount as they turn.",
              "Use the body lock to control and prevent the guard re-clamp.",
            ],
            "The body-lock pass is pure wrestling: the same body lock and off-balance used in a takedown, applied on the ground. It is high-percentage for a wrestler and hard to defend if the base is broken.",
            ["Body lock secured","Drive the roll","Finish in side control"]
          ),
          T("Passing vs. Closed Guard",
            "Breaking a closed guard without giving up the top position.",
            [
              "Control the head and one arm to prevent the guard from re-clamping.",
              "Stack the hips or use a knee cut to split the legs.",
              "Keep the weight forward and the base solid throughout.",
              "Flow to side control and re-secure before attacking.",
            ],
            "Closed guard is the position that stops wrestlers most. Learning to break it is the single biggest top-game upgrade, and it uses the same body control and forward drive you already have.",
            ["Control head and arm","Split the legs","Keep the base"]
          ),
        ]),
      TOPIC("Back Control Mastery",
        "The wrestler's most valuable asset is the ability to take the back. Learn to get there, keep it, and finish.",
        [
          T("Taking the Back (Body Lock)",
            "Use a body lock and hip pivot to steal the back from the top or bottom.",
            [
              "Secure a deep body lock with the arms and one leg.",
              "Pivot the hips and drive to rotate them onto their side or chest.",
              "Thread the arm under the chin as they turn.",
              "Land on the back with both hooks and go to the rear naked.",
            ],
            "Taking the back is the highest-value move in BJJ and a natural extension of a wrestler's body lock and hip drive. Once a wrestler can do this reliably, they have the sport's best position at will.",
            ["Deep body lock","Pivot the hips","Thread the arm"]
          ),
          T("Keeping the Back (Hooks)",
            "Maintain the back position under pressure — hooks, base, and head control.",
            [
              "Keep both hooks deep over the hips and under the armpits.",
              "Control the head and the base to stop the bridge and spin.",
              "Stay compact: the tighter you are, the harder they are to escape.",
              "Use the body weight to prevent them from creating space.",
            ],
            "Keeping the back is as important as taking it. A wrestler's base and body control make the hooks strong, but they must be maintained actively or the position is lost in one bridge.",

          T("Escaping the Back",
            "If you are on the bottom with the back taken, how to recover position.",
            [

              "Post a hand and shrimp to create the room to turn.",
              "Use a body lock on them to off-balance and reverse to your guard.",
              "Stay connected — the goal is a reset, not a panic.",
            ],
            "Escaping the back is a must-know survival skill. For a wrestler, the bridge-and-spin uses the same hip power as a sprawl, making the escape very natural.",
            ["Bridge for space","Spin away from the arm","Body-lock to reverse"]
          ),
        ]),
      TOPIC("Intermediate Submissions",
        "Add the higher-percentage chokes and arm locks that come from the guard and top systems above.",
        [
          T("Omoplata",
            "A shoulder lock from the guard, combining arm and leg control.",
            [
              "Control the arm and bring it across your body.",
              "Hook the leg around the shoulder and trap the arm with the thigh.",
              "Rotate to isolate the shoulder and apply pressure.",
              "Keep the control tight to finish or to off-balance.",
            ],
            "The omoplata is a shoulder lock that flows naturally from the arm control a wrestler already does in the grip fight. It is both a submission and a powerful off-balancing tool.",
            ["Arm across the body","Thigh traps the arm","Rotate to isolate"]
          ),
          T("Ezekiel / D'Arce Choke",
            "A choke from the arm across the neck, reachable from many positions.",
            [
              "Cross the arm over the neck and secure the grip.",
              "Keep the head control and the angle tight.",
              "Squeeze with the arm and the opposite hand.",
              "Use it from guard, side, or the top after a body lock.",
            ],
            "The D'Arce is one of the most accessible chokes and a natural follow to the body control and arm fights a wrestler loves. It finishes from many positions, making it a versatile addition.",
            ["Arm over the neck","Tight angle","Squeeze with the arms"]
          ),
          T("Kimura (advanced)",
            "Developing the kimura into a full system of attacks and off-balancing.",
            [
              "Maintain the figure-four and rotate the shoulder up and back.",
              "Use the kimura to off-balance and set up a sweep or armbar.",
              "Attack the finish by pulling across the chest.",
              "Chain it to other attacks when they defend.",
            ],
            "By blue belt the kimura should be a system, not a single move. For a wrestler, it is the bridge between hand-fighting, off-balancing, and finishing.",
            ["Figure-four maintained","Off-balance first","Chain the attacks"]
          ),
          T("Triangle (advanced)",
            "Developing the triangle into a control-and-attack system.",
            [
              "Maintain the ankle lock and the head control.",
              "Use the triangle to off-balance and set up a sweep or arm attack.",
              "Finish by tightening the scissors and keeping the head down.",
              "Chain to an armbar if they pull the head.",
            ],
            "The advanced triangle is a full position, not just a choke. For a wrestler, the leg entanglement and body control make it a dominant bottom game.",
            ["Ankle and head locked","Off-balance to sweep","Chain the attacks"]
          ),
        ]),
      TOPIC("Wrestler Integration (Blue)",
        "Systematize the takedown-to-ground flow so every takedown is part of a plan, not a scramble.",
        [
          T("Takedown Chains → Ground",
            "Link takedowns into sweeps and submissions as a continuous sequence.",
            [
              "Pick a takedown (e.g., single leg) and a ground follow (e.g., body-lock sweep).",
              "Drill the chain: takedown → landed position → sweep → attack.",
              "Add speed and resistance until the chain is smooth.",
              "Roll the chain as one continuous action.",
            ],
            "Chaining takedowns to ground attacks is the wrestler's biggest BJJ advantage. It means you are never 'starting over' on the ground — the takedown is the first link in a chain that ends in a tap.",
            ["Pick takedown + follow","Drill the chain","Roll as one action"]
          ),
          T("Using the Takedown Threat in Guard",
            "Let the threat of a takedown or body lock dictate your guard play.",
            [
              "In your guard, keep the body-lock option live to off-balance them.",
              "Use the threat to stop their pass and open your attack.",
              "Flow between the guard attack and the body-lock sweep.",
            ],
            "A wrestler in guard has a hidden weapon: the ability to body-lock and sweep. Keeping that threat alive makes the guard more active and the opponent more cautious, opening your real attack.",
            ["Keep body-lock live","Stop the pass","Flow to attack"]
          ),
          T("Sprawl → Offense",
            "Turn the defensive sprawl into an offensive body lock and attack.",
            [
              "Sprawl to defend, then immediately pivot into a body lock.",
              "Use the body lock to off-balance and sweep or take the back.",
              "Stay compact and keep the connection through the transition.",
            ],
            "Turning a defense (sprawl) straight into offense (body lock, back take) is a hallmark of strong wrestling-based BJJ. It means you are always attacking, even when reacting.",
            ["Sprawl to defend","Pivot to body lock","Sweep or take the back"]
          ),
        ]),
    ]
  },

  /* ============================ PURPLE BELT ============================ */
  {
    belt:"Purple", title:"Purple Belt",
    desc:"Refine and connect: full guard systems, pressure-based passing, advanced leg and choke work, and the back-game that makes a wrestler truly dangerous.",
    children:[
      TOPIC("Full Guard Systems",

        [
          T("Guard Switching",
            "Flow between guard positions without losing the connection or the attack.",
            [
              "Learn the common switches: closed → open, DLR → X, spider → closed.",
              "Keep one leg or hand connected through every switch.",
              "Use the switch to off-balance and set up the next attack.",
              "Practice the switches slowly, then at speed.",
            ],
            "Guard switching is what separates a guard 'position' from a guard 'game'. For a wrestler, it adds the fluidity that keeps the body-control advantage constant.",
            ["Keep one connection","Off-balance to switch","Slow, then fast"]

          T("Inverted / Rubber Guard",
            "Attacking from an inverted position with the body and legs wrapped.",
            [
              "Invert over them, keeping the legs hooked and the body connected.",
              "Use the inverted body lock to off-balance and sweep.",
              "Flow to a leg entanglement or a choke as they react.",
              "Stay compact to prevent the escape.",
            ],
            "Inverted guard is advanced bottom play that rewards a wrestler's body control and leg drive. It is high-risk, high-reward, and very effective against a top player.",

          T("Body Triangle (Leg Entanglement)",
            "Using the body triangle to control the base and set up leg or body attacks.",

              "Use the triangle to off-balance and control the base.",
              "Flow to a sweep, a leg entanglement, or a body lock.",
              "Keep the legs locked to maintain the control.",
            ],
            "The body triangle is the core of the modern leg-lock game and a natural extension of a wrestler's body lock. It gives a wrestler a powerful, connected bottom attack.",
            ["Legs locked around the torso","Off-balance with the base","Flow to the attack"]
          ),
        ]),
      TOPIC("Sweeps (Advanced)",
        "Inversion and leg-entanglement sweeps — the high-value bottom game that rewards a wrestler's body control and leg drive.",

              "Invert over them with the rubber guard legs hooked.",
              "Use the inverted body lock to off-balance them.",
              "Sweep by rolling them as they react.",
              "Flow to a leg entanglement or a back take.",
            ],
            "The rubber guard sweep is high-risk, high-reward advanced bottom play. For a wrestler, the body control and leg drive make it a powerful, dominant sweep against a strong top player.",

          ),
          T("Berimbolo / Body Triangle Inversion",
            "The signature inversion: flip over and into a body triangle for a high-value sweep or leg attack.",

              "Set up the inversion with the body triangle.",
              "Flip over them into the berimbolo position.",
              "Use the inversion to off-balance and control.",
              "Sweep or flow to a leg lock.",
            ],
            "The berimbolo is the pinnacle of the inversion game and a natural evolution of a wrestler's body lock and leg drive. It is high-value and very effective against a committed top player.",
            ["Body triangle set up","Flip over them","Off-balance to attack"]
          ),
          T("Leg Entanglement Sweep",
            "Use a leg entanglement to control the base and sweep from the bottom.",
            [
              "Establish the leg entanglement from the guard.",
              "Use the entanglement to control the base and off-balance.",
              "Sweep with the leg drive.",
              "Flow to a leg lock or the back.",
            ],
            "The leg entanglement sweep is the core of the modern bottom game. For a wrestler, the leg control makes it a powerful, connected sweep that flows straight into the leg-lock game.",
            ["Entanglement established","Control the base","Flow to the attack"]
          ),
          T("Deep Half Guard Sweep",
            "Sweep from the deep half guard using the safe, connected position as the platform.",
            [
              "From deep half, keep the head tucked and the far leg hooked.",
              "Off-balance with the body and the legs.",
              "Sweep by rolling them as they commit.",
              "Recover to your guard or take the back.",
            ],
            "The deep half sweep is a safe, high-percentage sweep from the 'I am not in trouble' guard. For a wrestler, it uses the base and body control they already have to reverse the top player.",
            ["Head tucked, leg hooked","Off-balance with the body","Recover to guard"]
          ),
          T("Long Guard / Ashi-Garami Sweep",
            "Sweep from long guard using the leg entanglement to set the reversal.",
            [
              "From long guard, establish the leg entanglement.",
              "Use the entanglement to off-balance them.",
              "Sweep with the leg drive.",
              "Flow to the ashi-garami or a body lock.",
            ],
            "The long guard sweep connects the bottom game to the leg-lock game. For a wrestler, it uses the leg control and body drive to sweep and set up the leg lock in the same action.",
            ["Long guard set up","Entanglement for control","Flow to the attack"]
          ),
        ]),
      TOPIC("Pressure-Based Passing",
        "Advanced passing that uses weight, base, and position to make the pass nearly impossible to defend.",
        [
          T("Weight Passing (Pressure System)",
            "Using body weight and base to make the pass unbreakable.",
            [

              "Move the pressure in a direction that breaks their base.",
              "Keep the base solid to prevent the sweep.",
              "Flow from one pressure point to the next to the pass.",
            ],
            "Weight passing is the top player's ultimate weapon and a natural fit for a wrestler who understands base and weight. It makes the pass a position you occupy, not a move you make.",
            ["Low base, weight on","Break their base","Flow the pressure"]
          ),
          T("Knee Cut → Deep Half",
            "Knee-cutting into the deep half guard and passing from there.",
            [

              "Drive to the deep half, controlling the base.",
              "From deep half, pass to side control or mount.",
              "Keep the pressure and the base throughout.",
            ],
            "Knee-cutting to deep half is a high-percentage pass for a wrestler, using the leg split and body drive they already have to reach a dominant position.",

          T("Passing Off a Takedown",

              "Flow to the pass and then the submission.",
              "Keep the connection through the whole sequence.",
            ],
            "Passing off a takedown is the purest expression of wrestling-based BJJ. The takedown is the entry to the pass, and the pass is the entry to the tap.",
            ["Land in a passing position","Control the base","Flow to the tap"]

        ]),
      TOPIC("Leg Lock Game",
        "The modern high-value game. Learn the entanglements, the attacks, and how to use them as a wrestler.",

            ],
            "Ashi-garami is the foundation of the leg-lock game and a natural extension of a wrestler's leg and body control. It is high-value and very effective against a top player.",

            "The ultimate leg lock — and the rules you must know around it.",
            [

              "Know the IBJJF rules: no heel hook from certain positions, and it is an instant win.",

            ],
            "The heel hook is the highest-value submission in modern BJJ. For a wrestler, the leg control makes it accessible, and the rules awareness keeps it safe and legal.",

          T("Knee Bar",

              "Hyperextend the knee to apply the bar.",
              "Keep the body close and the angle tight.",
              "Use it as a transitional attack or a finish.",
            ],
            "The knee bar is the most learnable leg lock and a great first leg submission for a wrestler. It uses the leg control and body position they already have.",
            ["Isolate the leg","Hyperextend the knee","Tight angle"]
          ),
        ]),
      TOPIC("Advanced Back Game",
        "Refine the back take, the back retention, and the chokes to make the back the centerpiece of your game.",
        [
          T("Back Take from Takedown",
            "Taking the back directly off a takedown for an instant high-value finish.",
            [
              "Take the takedown and control the body and the head.",
              "Pivot into the body lock and thread the arm for the back.",
              "Land on the back with both hooks and go to the choke.",
              "Keep the connection through the whole sequence.",
            ],
            "Taking the back off a takedown is the wrestler's signature finish. It turns a takedown into the highest-value position in the sport in one motion.",
            ["Control the body and head","Pivot to the back","Go to the choke"]

          T("Back Retention (Advanced)",
            "Keeping the back under heavy pressure from advanced escapes.",
            [

              "Control the head and the body to stop the spin.",
              "Use the body weight to prevent the bridge.",
              "Re-establish the hooks the instant they open.",
            ],
            "Advanced back retention is the difference between a back position you take and one you keep. For a wrestler, the base and body control are the key to holding it.",
            ["Hooks deep and solid","Control the head","Re-establish fast"]

          T("100% Choke / Body Choke",
            "A high-percentage choke from the back that works against most defenses.",
            [
              "From the back, control the head and the body.",
              "Thread the arm and apply the choke with the body.",
              "Keep the angle tight and the squeeze constant.",
              "Use it as a reliable finish from the back.",
            ],
            "The 100% is one of the most reliable chokes from the back. For a wrestler who can get and keep the back, it is a high-percentage finish that rarely misses.",
            ["Control the head and body","Thread the arm","Constant squeeze"]
          ),
        ]),
      TOPIC("Chain Wrestling & Off-Balance",
        "The wrestler's core skill, systematized: kuzushi (off-balance) and continuous chains that never let up.",
        [
          T("Kuzushi (Off-Balance)",
            "The principle of breaking balance that underlies every sweep, pass, and submission.",
            [
              "Identify the 8 directions of balance and attack one at a time.",
              "Use the grip, body, and base to pull them off-center.",
              "Follow the off-balance with the sweep, pass, or attack.",
              "Keep the off-balance moving so they can't recover.",
            ],
            "Off-balance is the single most important principle in BJJ and the wrestler's native language. Mastering kuzushi turns every position into an attack.",
            ["Attack one direction","Use grip and base","Follow with the attack"]

              "Practice the chains slowly, then at speed, then under resistance.",

          ),
        ]),

  /* ============================ BROWN BELT ============================ */

            ["From the entanglements","Apply the hook","Know the rules"]

/* ---------- bubble ORDER persistence ----------
   Remembers the vertical order of a parent's children (by node id) so a
   drag-reorder survives reloads. Coexists with the user-bubble / edit / delete
   stores; nodes not in the saved list (e.g. added later) simply land at the end. */
const ORDER_KEY="bjjNodeOrder_v1";
let nodeOrder={};
(function(){ try{ nodeOrder=JSON.parse(localStorage.getItem(ORDER_KEY)||"{}")||{}; }catch(e){ nodeOrder={}; } })();
function saveNodeOrder(){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(nodeOrder)); }catch(e){} }
function applyNodeOrder(){
  // restore root order (persisted under the "__ROOTS__" sentinel by nudge())
  const rootOrder=nodeOrder["__ROOTS__"];
  if(Array.isArray(rootOrder) && rootOrder.length){
    const rank=new Map(rootOrder.map((id,i)=>[id,i]));
    ROOTS.sort((a,b)=>{
      const ra=rank.has(a.id)?rank.get(a.id):Infinity;
      const rb=rank.has(b.id)?rank.get(b.id):Infinity;
      return ra-rb; // stable sort → any root not in the saved list lands after the listed ones
    });
  }
  for(const pid in nodeOrder){
    const parent=NODES.get(pid); if(!parent||!parent.children) continue;
    const order=nodeOrder[pid]||[];
    const rank=new Map(order.map((id,i)=>[id,i]));
    parent.children.sort((a,b)=>{
      const ra=rank.has(a.id)?rank.get(a.id):Infinity;
      const rb=rank.has(b.id)?rank.get(b.id):Infinity;
      return ra-rb; // Array.sort is stable → unlisted children keep their order, after the listed ones
    });
  }
}

/* Build a flat id map + parent links */
const NODES = new Map();      // id -> node
const PARENT = new Map();     // id -> parentId
function registerNode(n, parent){
  const base=(parent?parent.__id+"-":"") + String(n.title).replace(/[^\w]+/g,"_");
  let id=base, k=2;
  while(NODES.has(id)) id=base+"_"+k++;
  n.__id=id; n.id=id; n.depth=parent?parent.depth+1:0;
  NODES.set(id, n);
  if(parent) PARENT.set(id, parent.id);
}
(function build(n, parent, depth){
  registerNode(n, parent);
  (n.children||[]).forEach(c=>build(c,n,depth+1));
})(ROOT, null, 0);

  for(;;){

    for(const r of remaining){
      const parent=NODES.get(r.parentId);
      if(!parent){ still.push(r); continue; }
      const n={
        title:String(r.title||"Untitled"),
        desc:String(r.desc==null?"":r.desc),
        how:Array.isArray(r.how)?r.how.map(s=>String(s)):[],
        why:String(r.why==null?"":r.why),

        children:[],

      parent.children=parent.children||[];
      parent.children.push(n);
      registerNode(n,parent);

    }
    if(!attached) break;      // the rest are orphans (their parent is gone) — drop

function removeBubble(n){
