/* ---------- Reorder / re-parent a bubble by dragging (cycle-safe) ---------- */
function redepth(n,d){ n.depth=d; (n.children||[]).forEach(c=>redepth(c,d+1)); }
function isAncestorOf(anc,desc){ let cur=PARENT.get(desc.id); while(cur){ if(cur===anc.id) return true; cur=PARENT.get(cur); } return false; }
function moveBubble(dragged,target,above){
  if(!dragged||!target||dragged.id===target.id) return false;
  if(dragged.depth===0) return false;                       // ROOT can't be moved
  const oldParent=NODES.get(PARENT.get(dragged.id)); if(!oldParent) return false;
  const keepBelt=beltOf(dragged);   // remember the card's current belt so it keeps its colour after moving
  // Decide the destination parent (block moves that would create a cycle)
  let newParent;
  if(target===oldParent) return false;                // own parent -> no-op (reorder with the up/down arrows)               // dropped on the parent card → top/bottom of its list
  else if(PARENT.get(target.id)===oldParent.id) return false; // sibling -> no-op (drag attaches to a different bubble) // dropped on a sibling → reorder
  else if(isAncestorOf(dragged,target)) return false;        // target is inside dragged's own subtree → nesting would create a cycle
  else newParent=target;                                     // dropped elsewhere → re-parent under it (incl. promote to a higher level)
  target.children=target.children||[];
  oldParent.children=(oldParent.children||[]).filter(c=>c.id!==dragged.id);       // remove first
  let insertAt;
  if(newParent===oldParent && target===oldParent) insertAt = above?0:oldParent.children.length;
  else if(newParent===oldParent){ const ti=oldParent.children.indexOf(target); insertAt = ti<0?(above?0:oldParent.children.length):(above?ti:ti+1); }
  else insertAt = above?0:target.children.length;
  insertAt=Math.max(0,Math.min(insertAt,newParent.children.length));
  newParent.children.splice(insertAt,0,dragged);
  PARENT.set(dragged.id,newParent.id);                       // keep the data model consistent
  redepth(dragged,newParent.depth+1);
  if(keepBelt) dragged.belt=keepBelt;   // lock colour: a White card stays White even after being moved elsewhere
  state.expanded.add(newParent.id); saveExpanded();
  if(dragged.__user){ const r=recordOf(dragged); if(r){ r.parentId=newParent.id; r.belt=(dragged.belt||null); } saveUserNodes(); }
  nodeOrder[oldParent.id]=(oldParent.children||[]).map(c=>c.id);
  if(newParent!==oldParent) nodeOrder[newParent.id]=(newParent.children||[]).map(c=>c.id);
  saveNodeOrder();
  return true;
}

function nudge(n, dir){
  // dir: -1 = move up, +1 = move down. Reorder n among its siblings (the roots, or its parent children).
  if(!n) return;
  const pid=PARENT.get(n.id);
  const cont = pid ? NODES.get(pid).children : ROOTS;
  if(!cont || cont.length<2) return;
  const i=cont.indexOf(n); if(i<0) return;
  const j=i+dir; if(j<0 || j>=cont.length) return;
  cont[i]=cont[j]; cont[j]=n;
  const key = pid || "__ROOTS__";   // roots have no parent — persist their order under a sentinel key
  nodeOrder[key]=(cont||[]).map(c=>c.id);
  saveNodeOrder();
  render();
  revealNode(n.id);
}

/* ======================= LAYOUT ======================= */
const M = { cardH:86, vGap:26, hGap:96, nodeW:272, padTop:40, padLeft:40 };

function computeLayout(){
  // Build the visible tree (respecting expansion + belt filter)
  let leafCounter = 0;
  function assign(n){
    n.visChildren = visibleChildren(n);
    if(n.visChildren.length===0){
      n.ly = leafCounter++;
    }else{
      n.visChildren.forEach(assign);
      const ys = n.visChildren.map(c=>c.ly);
      n.ly = (Math.min(...ys)+Math.max(...ys))/2;
    }
  }
  ROOTS.forEach(assign);
  const totalLeaves = Math.max(leafCounter,1);
  const mapH = totalLeaves*(M.cardH+M.vGap);
  let maxDepth=0;
  ROOTS.forEach(function(r){ (function w(n){ if(n.depth>maxDepth) maxDepth=n.depth; n.visChildren.forEach(w); })(r); });
  const mapW = M.padLeft + (maxDepth+1)*(M.nodeW+M.hGap) + 40;
  function place(n, parent){
    n.px = M.padLeft + n.depth*(M.nodeW+M.hGap);
    n.py = M.padTop + n.ly*(M.cardH+M.vGap);
    if(parent){
      const mid = { x:(parent.px+M.nodeW+n.px)/2, y:parent.py+M.cardH/2 };
      n.edge = `M ${parent.px+M.nodeW} ${parent.py+M.cardH/2} C ${mid.x} ${mid.y}, ${mid.x} ${n.py+M.cardH/2}, ${n.px} ${n.py+M.cardH/2}`;
    }
    n.visChildren.forEach(c=>place(c,n));
  }
  ROOTS.forEach(function(r){ place(r,null); });
  return { mapW, mapH };
}

function aiErrorText(e){

    return "Timed out waiting for the model — it may still be loading. Wait a moment and try again.";
  if(aiSettings.backend==="gemini"){
    if(/HTTP 400/i.test(m))
      return "Gemini rejected the request (HTTP 400). Check that your API key and model name are correct.";
    if(/HTTP 401|invalid.*key/i.test(m))
      return "Gemini API key is invalid. Get a free key at https://aistudio.google.com/apikey";
    if(/HTTP 403/i.test(m))
      return "Gemini access denied (HTTP 403). Your key may have been disabled or has no access to this model.";
    if(/HTTP 404/i.test(m))
      return "Model not found (HTTP 404). The model is not available. Press 'Load models' in AI Settings to see what is available with your key.";
    if(/HTTP 429/i.test(m))

/* ======================= INTERACTION =======================
   Single click  → expand / collapse the node's children
   Double click  → open the full-screen detail panel
   A click "arms" the single-click action 300ms out; a second click on the
   same node inside that window cancels it and opens detail instead. */
let __singleClickTimer=null;
let __lastClick={t:0,id:null};
function doToggleExpand(n){
  if(!(n.children && n.children.length)) return;          // leaf: nothing to expand
  setExpanded(n, !isExpanded(n));
  // also expand ancestors so the path stays visible
  let p=PARENT.get(n.id);
  while(p){ setExpanded(NODES.get(p),true); p=PARENT.get(p); }
  render();
  revealNode(n.id);   // re-center on the tapped node at a readable zoom
}
function onNodeClick(n){
  const now=Date.now();
  if(__lastClick.id===n.id && (now-__lastClick.t)<300){  // ---- double click / double tap ----
    __lastClick={t:0,id:null};
    if(__singleClickTimer){ clearTimeout(__singleClickTimer); __singleClickTimer=null; }
    select(n);                                            // open the full-screen detail panel
    render();
    return;
  }
  __lastClick={t:now,id:n.id};                            // ---- candidate single click ----
  if(__singleClickTimer){ clearTimeout(__singleClickTimer); }
  __singleClickTimer=setTimeout(function(){ __singleClickTimer=null; doToggleExpand(n); },300);
}

function wireDetail(n, isUser){

  });

    const syncHow=()=>{ const v=howTa.value; const lines=(v==="")?0:v.split("\n").length;

    if(bkSel) aiSettings.backend=bkSel.value;

      if(gKey) aiSettings.geminiKey=gKey.value.trim();
      if(gMod) aiSettings.model=gMod.value.trim()||"gemini-2.5-flash";
    }else{
      if(ep) aiSettings.endpoint=ep.value.trim()||"http://192.168.2.88:11434";
      if(mo) aiSettings.model=mo.value.trim()||"qwen3.8:latest";
    }
    saveAISettings();
  };
  if(bkSel) bkSel.addEventListener("change",()=>{
    aiSettings.backend=bkSel.value;
    const gf=detailInner.querySelector("#geminiFields");
    const of=detailInner.querySelector("#ollamaFields");
    if(gf) gf.style.display=aiSettings.backend==="gemini"?"":"none";
    if(of) of.style.display=aiSettings.backend==="ollama"?"":"none";
    saveAISettings();
  });
  if(gKey) gKey.addEventListener("change",saveSet);
  if(gMod) gMod.addEventListener("change",saveSet);
  if(ep) ep.addEventListener("change",saveSet);
  if(mo) mo.addEventListener("change",saveSet);
  const lm=detailInner.querySelector('[data-act="loadModel"]');
  if(lm) lm.addEventListener("click",async ()=>{
    saveSet();

      if(aiSettings.backend==="ollama" && mo) mo.value=aiSettings.model;
    }catch(e){
      const msg=aiSettings.backend==="gemini"
        ? "Couldn''t load Gemini models. Check your API key and internet connection.\n\n"+String((e&&e.message)||e)
        : "Couldn''t reach "+aiSettings.endpoint+" \u2014 is Ollama running?\n\n"+String((e&&e.message)||e);
      alert(msg);
    }
    lm.disabled=false; lm.textContent=old;
  });

  // editable fields (auto-save; overview/title also refresh the bubble card)
  const flash=()=>{
    const f=detailInner.querySelector("#savedFlash");
    if(!f) return;
    f.classList.add("show");

  bind("#editWhy", v=>{ n.why=v.trim(); });
  bind("#editCues", v=>{ n.cues=v.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); });

  // remove this bubble (and any user bubbles under it)
  const rm=detailInner.querySelector('[data-act="removeBubble"]');
  if(rm) rm.addEventListener("click",()=>{
    if(n.depth===0) return;   // ROOT can't be deleted
    if(!confirm(`Remove “${n.title}— and any bubbles added under it?`)) return;
    const p=NODES.get(PARENT.get(n.id));

    saveDeletedNodes();
    if(p){ ensurePath(p); select(p); } else { select(ROOT); }
    render();
    refreshBeltCounts();
  });
}

function exportSelfContained(){
  // Bake the current video links + user bubbles into the SEED blocks and download the file.
  const links = {};
  Object.keys(videoLinks).forEach(k=>{ const v=String(videoLinks[k]||"").trim(); if(v) links[k]=v; });
  const json = JSON.stringify(links, null, 2);
  let html = "<!doctype html>\n" + document.documentElement.outerHTML;
  const re = /\/\*__SEED_START__\*\/[\s\S]*?\/\*__SEED_END__\*\//;
  if(!re.test(html)){ alert("Couldn't find the link block in this page."); return; }
  html = html.replace(re, "/*__SEED_START__*/\n" + json + "\n/*__SEED_END__*/");
  const nodeRe = /\/\*__SEED_NODES_START__\*\/[\s\S]*?\/\*__SEED_NODES_END__\*\//;
  if(nodeRe.test(html)){
    const clean = (userNodeRecords||[]).filter(r=>r&&r.uid).map(r=>({
      uid:r.uid, parentId:r.parentId, title:r.title,
      desc:String(r.desc||""), how:Array.isArray(r.how)?r.how:[],
      why:String(r.why||""), cues:Array.isArray(r.cues)?r.cues:[],
    }));
    html = html.replace(nodeRe, "/*__SEED_NODES_START__*/\n" + JSON.stringify(clean, null, 2) + "\n/*__SEED_NODES_END__*/");
  }
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "bjj-mindmap-self-contained.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

  const cx=n.px+M.nodeW/2, cy=n.py+M.cardH/2;
  state.view.s=s;
  state.view.x=(r.width/2)-cx*s;
  state.view.y=(r.height/2)-cy*s;
  viewport.setAttribute("transform",`translate(${state.view.x},${state.view.y}) scale(${state.view.s})`);
  saveView();
}
function fit(){
  const {mapW,mapH}=computeLayout();
  const r=svg.getBoundingClientRect();
  const s=Math.min(r.width/(mapW+40), r.height/(mapH+40), 1.1);
  state.view.s=s;
  state.view.x=(r.width-(mapW+40)*s)/2;
  state.view.y=(r.height-(mapH+40)*s)/2;
  render();
  saveView();
}
/* Mobile: fit-to-whole-map collapses the tree to a few pixels on a phone
   (map ~6700px tall vs a ~650px viewport -> scale ~0.09, cards ~8px). Instead
   open at a readable scale, centred on the root, and let the user pinch-zoom. */
function startMobile(){
  const r=svg.getBoundingClientRect();
  const w=r.width||640;
  const s=Math.min(0.9,Math.max(0.6,w/640));
  const target=(state.selectedId&&NODES.get(state.selectedId))||ROOT;
  const cx=(target.px||0)+M.nodeW/2, cy=(target.py||0)+M.cardH/2;
  state.view.s=s;
  state.view.x=(w/2)-cx*s;
  state.view.y=18-cy*s;
  render();
  saveView();
}
function zoomBy(f){
  const r=svg.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2;
  const ns=Math.max(0.3,Math.min(2.5,state.view.s*f));
  state.view.x = cx - (cx-state.view.x)*(ns/state.view.s);
  state.view.y = cy - (cy-state.view.y)*(ns/state.view.s);
  state.view.s=ns;
  render();
  saveView();
}

/* pan & pinch-zoom on svg (mouse + touch). One finger pans; two fingers
   pinch-zoom about their midpoint. Tapping a bubble is untouched — we bail out
   of panning whenever a pointer lands on a .node. */
let panning=null;
let pinch=null;                  // {d0, s0, x0, y0, mx, my}
const svgPointers=new Map();     // pointerId -> {x,y}
svg.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node")) return;        // let the bubble's own click / drag handle it
  svgPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(svgPointers.size===1){
    panning={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};
    svg.classList.add("panning");
  } else if(svgPointers.size===2){
    panning=null;
    const [a,b]=[...svgPointers.values()];
    pinch={ d0:Math.max(24,Math.hypot(a.x-b.x,a.y-b.y)), s0:state.view.s, x0:state.view.x, y0:state.view.y, mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
  }
  if(svg.setPointerCapture){ try{ svg.setPointerCapture(e.pointerId); }catch(err){} }
});
svg.addEventListener("pointermove",e=>{
  if(!svgPointers.has(e.pointerId)) return;
  svgPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && svgPointers.size>=2){
    const [a,b]=[...svgPointers.values()];
    const d=Math.max(24,Math.hypot(a.x-b.x,a.y-b.y));
    const ns=Math.max(0.15,Math.min(2.5,pinch.s0*(d/pinch.d0)));
    const k=ns/pinch.s0;
    state.view.s=ns;
    state.view.x=pinch.mx-(pinch.mx-pinch.x0)*k;
    state.view.y=pinch.my-(pinch.my-pinch.y0)*k;
    viewport.setAttribute("transform",`translate(${state.view.x},${state.view.y}) scale(${state.view.s})`);
    return;
  }
  if(panning && svgPointers.size===1){
    state.view.x=panning.vx+(e.clientX-panning.x);
    state.view.y=panning.vy+(e.clientY-panning.y);
    viewport.setAttribute("transform",`translate(${state.view.x},${state.view.y}) scale(${state.view.s})`);
  }
});
function endPointer(e){
  svgPointers.delete(e.pointerId);
  if(svgPointers.size<2) pinch=null;
  if(svgPointers.size===0){ panning=null; svg.classList.remove("panning"); saveView(); }
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:0.89;
  const ns=Math.max(0.3,Math.min(2.5,state.view.s*f));
  state.view.x = mx - (mx-state.view.x)*(ns/state.view.s);
  state.view.y = my - (my-state.view.y)*(ns/state.view.s);
  state.view.s=ns;
  viewport.setAttribute("transform",`translate(${state.view.x},${state.view.y}) scale(${state.view.s})`);
  saveView();
},{passive:false});

/* ======================= TECHNIQUE LIBRARY (left panel) ======================= */
const LIB = { collapsed:new Set() };
let currentLibQuery = "";
function libDiv(cls){ const d=document.createElement("div"); if(cls) d.className=cls; return d; }

/* ---------- USER section: live index of the user's own bubbles (added via "Add a bubble") ---------- */
const USER_COLOR = "#2dd4bf";   // teal accent for the "User" section
const USER_SEED = [
  { title:"Attack",  desc:"", how:[], why:"", cues:[] },
  { title:"Defence", desc:"", how:[], why:"", cues:[] }
];
function isPopulated(n){
  if(!n || !n.__user) return false;
  if(!(String(n.title||"").trim())) return false;
  return !!( (String(n.desc||"").trim())
    || (n.how && n.how.length)
    || (String(n.why||"").trim())
    || (n.cues && n.cues.length)
    || (typeof hasVideo === "function" && hasVideo(n)) );
}
function collectUserCards(){
  const out=[]; const seen=new Set();
  (ROOTS||[]).forEach(function(root){
    (function walk(n){
      // List user *bubbles* (depth > 0) that have a title (content NOT required),
      // so a bubble shows up in the library the moment it is added. Top-level roots
      // (depth 0) are categories, not techniques, so they stay out of this list.
      if(n && n.__user && n.depth>0 && String(n.title||"").trim() && !seen.has(n.id)){ seen.add(n.id); out.push(n); }
      (n.children||[]).forEach(walk);
    })(root);
  });
  return out;
}
function refreshUserLib(){ try{ renderLib(currentLibQuery); }catch(err){} }

function renderLib(query){
  const box = document.getElementById("libTree");
  if(!box) return;
  const q = ((query==null?"":String(query))).trim().toLowerCase();
  currentLibQuery = (query==null?"":String(query));
  box.innerHTML = "";
  let anyBelt = false;
  (ROOT.children||[]).forEach(function(belt, bi){
    const color = BELT_COLOR[belt.belt] || "#888";
    const groups = [];
    (belt.children||[]).forEach(function(topic){
      const techs = (topic.children||[]).filter(function(t){
        return !q || ((t.title + " " + (t.desc||"")).toLowerCase().indexOf(q) !== -1);
      });
      if(techs.length) groups.push({ topic:topic, techs:techs });
    });
    if(!groups.length) return;
    anyBelt = true;
    const key = "b" + bi;
    const collapsed = LIB.collapsed.has(key);
    let total = 0; groups.forEach(function(g){ total += g.techs.length; });

    const section = libDiv("tree-section");
    const row = libDiv("tree-row" + (collapsed ? " collapsed" : ""));
    row.innerHTML = '<span class="tw">▾</span><span class="dot" style="background:' + color + '"></span>'
      + '<span class="label">' + esc(belt.title) + '</span><span class="cnt">' + total + '</span>';
    row.addEventListener("click", function(){
      if(LIB.collapsed.has(key)) LIB.collapsed.delete(key); else LIB.collapsed.add(key);
      renderLib(currentLibQuery);
    });
    section.appendChild(row);

    const kids = libDiv("tree-children" + (collapsed ? " hidden" : ""));
    groups.forEach(function(g){
      const tl = libDiv("topic-label");
      tl.textContent = g.topic.title;
      kids.appendChild(tl);
      g.techs.forEach(function(t){
        const item = libDiv("tree-item"); item.draggable=true;
        item.innerHTML = '<span class="dot" style="background:' + color + '"></span>'
          + '<span class="label">' + esc(t.title) + '</span>';
        item.addEventListener("dragstart", function(e){
          e.dataTransfer.effectAllowed = "copy";
          const payload = { title:t.title, desc:(t.desc||""), how:(t.how||[]).slice(), why:(t.why||""), cues:(t.cues||[]).slice(), belt:(belt.belt||null) };
          const json = JSON.stringify(payload);
          try{ e.dataTransfer.setData("application/x-bjj-technique", json); }catch(err){}
          e.dataTransfer.setData("text/plain", json);
        });
        kids.appendChild(item);
      });
    });
    section.appendChild(kids);
    box.appendChild(section);
  });
  /* ---- USER section (seeds + the user's own populated cards, kept live) ---- */
  let anyUser = false;
  (function(){
    const cards = collectUserCards();
    const cardTitles = new Set();
    cards.forEach(function(c){ cardTitles.add(String(c.title).toLowerCase()); });
    const items = [];
    USER_SEED.forEach(function(s){ if(!cardTitles.has(String(s.title).toLowerCase())) items.push({ node:null, seed:s }); });
    cards.forEach(function(c){ items.push({ node:c, seed:null }); });
    const filtered = items.filter(function(it){
      const title = String(it.node ? it.node.title : it.seed.title);
      return !q || title.toLowerCase().indexOf(q) !== -1;
    });
    if(!filtered.length) return;
    anyUser = true;
    const key = "user";
    const collapsed = LIB.collapsed.has(key);
    const section = libDiv("tree-section");
    const row = libDiv("tree-row" + (collapsed ? " collapsed" : ""));
    row.innerHTML = '<span class="tw">▾</span><span class="dot" style="background:' + USER_COLOR + '"></span>'
      + '<span class="label">User</span><span class="cnt">' + filtered.length + '</span>';
    row.addEventListener("click", function(){
      if(LIB.collapsed.has(key)) LIB.collapsed.delete(key); else LIB.collapsed.add(key);
      renderLib(currentLibQuery);
    });
    section.appendChild(row);
    const kids = libDiv("tree-children" + (collapsed ? " hidden" : ""));
    filtered.forEach(function(it){
      const src = it.node || it.seed;
      const title = String(src.title);
      const item = libDiv("tree-item"); item.draggable=true;
      item.innerHTML = '<span class="dot" style="background:' + USER_COLOR + '"></span><span class="label">' + esc(title) + '</span>';
      // drag onto the canvas → create a card there (inverse of the list→card flow)
      item.addEventListener("dragstart", function(e){
        e.dataTransfer.effectAllowed = "copy";
        const payload={ title:src.title, desc:(src.desc||""), how:(src.how||[]).slice(), why:(src.why||""), cues:(src.cues||[]).slice(), belt:null, userItem:true };
        const json=JSON.stringify(payload);
        try{ e.dataTransfer.setData("application/x-bjj-technique", json); }catch(err){}
        e.dataTransfer.setData("text/plain", json);
      });
      // clicking an item that maps to a real card → jump to it on the map (search)
      if(it.node){
        item.style.cursor="pointer";
        item.title="Locate on the map";
        item.addEventListener("click", function(){ ensurePath(it.node); select(it.node); render(); });
      }
      kids.appendChild(item);
    });
    section.appendChild(kids);
    box.appendChild(section);
  })();

  if(!anyBelt && !anyUser) box.innerHTML = '<div class="lib-empty">No techniques found' + (q ? ' for "' + esc(currentLibQuery) + '"' : '') + '.</div>';
}

function libNodeAt(cx, cy){
  const t = document.elementFromPoint(cx, cy);
  const g = (t && t.closest) ? t.closest("g.node") : null;
  const id = (g && g.dataset) ? g.dataset.id : null;
  return (id && NODES.has(id)) ? NODES.get(id) : ROOT;
}

function libClearDropHl(){
  const sv = document.getElementById("svg");
  if(sv) sv.querySelectorAll("g.node.dropover").forEach(function(n){ n.classList.remove("dropover"); });
}

function libDropPayload(e){
  let raw = "";
  try{ raw = e.dataTransfer.getData("application/x-bjj-technique") || e.dataTransfer.getData("text/plain"); }catch(err){}
  if(!raw) return null;
  let d = null;
  try{ d = JSON.parse(raw); }catch(err){}
  return (d && d.title) ? d : null;
}

function refreshBeltCountsInline(){
  BELTS.forEach(function(b){
    const c = document.querySelector('#belts .chip[data-belt="' + b + '"] .count');
    if(c) c.textContent = countTechniques(b);
  });
}

(function wireLibrary(){
  const filter = document.getElementById("libFilter");
  if(filter){
    let t = null;
    filter.addEventListener("input", function(){
      clearTimeout(t);
      t = setTimeout(function(){ renderLib(filter.value); }, 200);
    });
  }
  const ex = document.getElementById("libExpand");
  if(ex) ex.addEventListener("click", function(){ LIB.collapsed.clear(); renderLib(currentLibQuery); });
  const co = document.getElementById("libCollapse");
  if(co) co.addEventListener("click", function(){ (ROOT.children||[]).forEach(function(b,i){ LIB.collapsed.add("b"+i); }); LIB.collapsed.add("user"); renderLib(currentLibQuery); });
  const tg = document.getElementById("libToggle");
  if(tg) tg.addEventListener("click", function(){
    const m = document.querySelector("main");
    const collapsed = m.classList.toggle("libcollapsed");
    tg.textContent = collapsed ? "▴" : "▾";
    tg.title = collapsed ? "Show library" : "Hide library";
  });
  const ob = document.getElementById("libOpenTab");
  if(ob) ob.addEventListener("click", function(){
    const m = document.querySelector("main");
    if(m) m.classList.remove("libcollapsed"); var tg2=document.getElementById("libToggle"); if(tg2){ tg2.textContent="▾"; tg2.title="Hide library"; }
  });
  const sv = document.getElementById("svg");
  if(sv){
    sv.addEventListener("dragover", function(e){
      if(reorderDrag) return;
      if(!e.dataTransfer) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const g = (t && t.closest) ? t.closest("g.node") : null;
      libClearDropHl();
      if(g) g.classList.add("dropover");
    });
    sv.addEventListener("dragleave", function(e){
      const t = e.target;
      if(t && t.closest && t.closest("g.node")) libClearDropHl();
    });
    sv.addEventListener("drop", function(e){
      if(reorderDrag) return;
      e.preventDefault();
      libClearDropHl();
      const data = libDropPayload(e);
      if(!data) return;
      const target = libNodeAt(e.clientX, e.clientY);
      const node = addChildBubble(target, data);
      state.expanded.add(target.id); saveExpanded();
      refreshBeltCountsInline();
      select(node);
      render();
      revealNode(node.id);
    });
  }
})();

/* ======================= REORDER / RE-PARENT BUBBLES BY DRAGGING =======================
   Drag any non-root bubble to a new spot:
   - drop on a SIBLING        → reorder above/below it (e.g. drag "test" above "Black belt")
   - drop on the PARENT card  → move to the top / bottom of that parent's list
   - drop on another branch   → re-parent it under that bubble (cycle-safe)
   The new order is persisted to localStorage (bjjNodeOrder_v1) and survives reloads. */
let reorderDrag=null;        // id of the bubble currently being dragged
let reorderLine=null;
function clearReorderHl(){
  const sv=document.getElementById("svg");
  if(sv) sv.querySelectorAll("g.node.reorderover").forEach(function(n){ n.classList.remove("reorderover"); });
}
function showDropLine(x,y){
  if(!reorderLine){
    reorderLine=document.createElementNS("http://www.w3.org/2000/svg","line");
    reorderLine.setAttribute("class","reorderLine");
    viewport.appendChild(reorderLine);
  }
  reorderLine.setAttribute("x1",x); reorderLine.setAttribute("x2",x+M.nodeW);
  reorderLine.setAttribute("y1",y); reorderLine.setAttribute("y2",y);
}
function hideDropLine(){ if(reorderLine && reorderLine.parentNode) reorderLine.parentNode.removeChild(reorderLine); reorderLine=null; }
function reorderPoint(e){
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const g=(t&&t.closest)?t.closest("g.node"):null;
  const id=(g&&g.dataset)?g.dataset.id:null;
  const n=(id&&NODES.has(id))?NODES.get(id):null;
  if(!n) return null;
  let above=true;
  const card=g.querySelector("rect.card");
  if(card){ const r=card.getBoundingClientRect(); above = e.clientY < (r.top + r.height/2); }
  return {n, above};
}
(function wireReorder(){
  const sv=document.getElementById("svg");
  if(!sv) return;
  sv.addEventListener("dragover",function(e){
    if(!reorderDrag) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect="move";
    clearReorderHl(); hideDropLine();
    const p=reorderPoint(e);
    if(!p) return;
    const gEl=document.elementFromPoint(e.clientX,e.clientY);
    const g=(gEl&&gEl.closest)?gEl.closest("g.node"):null;
    if(g) g.classList.add("reorderover");
    showDropLine(p.n.px, p.above?p.n.py : p.n.py+M.cardH);
  });
  sv.addEventListener("dragleave",function(e){
    if(!reorderDrag) return;
    const t=e.target;
    if(t&&t.closest&&t.closest("g.node")) clearReorderHl();
  });
  sv.addEventListener("drop",function(e){
    if(!reorderDrag) return;
    e.preventDefault();
    clearReorderHl(); hideDropLine();
    const dragged=NODES.get(reorderDrag);
    const p=reorderPoint(e);
    reorderDrag=null;
    if(!dragged||!p) return;
    if(moveBubble(dragged,p.n,p.above)){
      refreshBeltCountsInline();
      ensurePath(dragged);
      render();
      revealNode(dragged.id);
    }
  });
})();

/* ======================= TOUCH DRAG (mobile reorder / re-parent) =======================
   HTML5 drag-and-drop (draggable + dragstart/drop) does NOT fire on touch, so on a phone
   a bubble can't be reordered or moved onto My Skills. This adds a pointer-based drag for
   touch/pen that reuses the EXACT same moveBubble() action + preview as the desktop drop.
   A plain tap is left untouched (it still opens the bubble via the node's click handler). */
(function wireTouchDrag(){
  const sv = document.getElementById("svg");
  if(!sv) return;
  let d = null;                     // { id, x0, y0, cx, cy, active, srcG }
  const THRESH = 8;                // px of travel before a press counts as a drag (else it's a tap)

  function paint(cx, cy){          // same preview the desktop dragover shows
    clearReorderHl(); hideDropLine();
    const p = reorderPoint({ clientX:cx, clientY:cy });
    if(!p) return;
    const el2 = document.elementFromPoint(cx, cy);
    const g = (el2 && el2.closest) ? el2.closest("g.node") : null;
    if(g) g.classList.add("reorderover");
    showDropLine(p.n.px, p.above ? p.n.py : p.n.py + M.cardH);
  }

  sv.addEventListener("pointerdown", function(e){
    if(e.pointerType === "mouse") return;              // desktop keeps using HTML5 DnD
    if(e.button !== undefined && e.button !== 0) return;
    const g = (e.target && e.target.closest) ? e.target.closest("g.node") : null;
    if(!g) return;
    if(e.target && e.target.closest && e.target.closest(".navbtn")) return;   // taps on the up/down buttons are handled by the button, not as a drag
    const id = (g && g.dataset) ? g.dataset.id : null;
    const n = (id && NODES.has(id)) ? NODES.get(id) : null;
    if(!n || n.depth === 0) return;                     // roots can't be moved
    d = { id:n.id, x0:e.clientX, y0:e.clientY, cx:e.clientX, cy:e.clientY, active:false, srcG:g };
  }, { passive:true });

  window.addEventListener("pointermove", function(e){
    if(!d) return;
    d.cx = e.clientX; d.cy = e.clientY;
    if(!d.active){
      if(Math.hypot(d.cx-d.x0, d.cy-d.y0) < THRESH) return;   // still a tap — don't hijack
      d.active = true;
      if(d.srcG) d.srcG.classList.add("dragSrc");
    }
    paint(d.cx, d.cy);
  });

  function teardown(){
    if(d && d.srcG) d.srcG.classList.remove("dragSrc");
    clearReorderHl(); hideDropLine();
    d = null;
  }

  window.addEventListener("pointerup", function(e){
    if(!d) return;
    if(!e.isPrimary){ teardown(); return; }            // a second finger joined → bail cleanly
    const draggedId = d.id, cx = d.cx, cy = d.cy, wasDrag = d.active;
    teardown();
    if(!wasDrag) return;                                // it was a tap → let the node's click open it
    __lastTouchDragAt = Date.now();                    // swallow any trailing synthetic tap that follows this drag
    const dragged = NODES.get(draggedId);
    const p = reorderPoint({ clientX:cx, clientY:cy });
    if(dragged && p && moveBubble(dragged, p.n, p.above)){
      refreshBeltCountsInline();
      ensurePath(dragged);
      render();
      revealNode(dragged.id);
    }
  });

  window.addEventListener("pointercancel", teardown);
})();

// Remember the last expanded/collapsed state across refreshes; on first run default to root + White + its first topic
(function restoreExpanded(){
  let raw=null, saved=null, has=false;
  try{ raw=localStorage.getItem(EXPANDED_KEY); if(raw!=null){ saved=JSON.parse(raw); has=true; } }catch(e){ has=false; saved=null; }
  if(has && Array.isArray(saved)){ saved.forEach(function(id){ state.expanded.add(id); }); return; }
  state.expanded.add(ROOT.id);
  const wb=[...NODES.values()].find(n=>n.belt==="White");
  if(wb){ state.expanded.add(wb.id); if(wb.children && wb.children[0]) state.expanded.add(wb.children[0].id); }
})();
select(ROOT);   // populate the detail panel with the overview + the 5 belts
closeDetailSheet();   // start closed on all sizes; the panel opens when a card is clicked
render();
requestAnimationFrame(function(){
  if(restoreView()){ return; }   // restore remembered pan/zoom so a newly added root (or wherever you left it) stays in view across a refresh
  if(window.matchMedia && window.matchMedia("(max-width: 1024px)").matches){
    startMobile();           // phones: readable scale centred on the root (not fit-to-whole-map)
  } else {
    fit();
  }
});
window.addEventListener("resize",()=>{ /* keep view; user can refit */ });
